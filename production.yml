name: pxl8-prod

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pxl8}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pxl8}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-ghcr.io/pixelating-community/web:main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REQUIRE_EXISTING_DATA: ${REQUIRE_EXISTING_DATA:-0}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3100}:3000"
    command: ["sh", "-lc", "bun run migrate && exec sh scripts/run-web.sh prod"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/api/obj/health'); if (!response.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  ffmpeg-worker:
    image: ${FFMPEG_WORKER_IMAGE:-ghcr.io/pixelating-community/web-ffmpeg-worker:main}
    pull_policy: always
    profiles:
      - worker
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REQUIRE_EXISTING_DATA: ${REQUIRE_EXISTING_DATA:-0}
    volumes:
      - ./models:/models:ro
    command: ["sleep", "infinity"]

volumes:
  postgres_data:
    name: pxl8_postgres_data
